repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        types: [markdown]
      - id: end-of-file-fixer
        types: [markdown]
      - id: check-yaml
      - id: check-added-large-files
  - repo: local
    hooks:
      - id: update-readme
        name: Update README.md with FEP listing
        language: script
        entry: contrib/update_readme.py
        pass_filenames: false
        always_run: true

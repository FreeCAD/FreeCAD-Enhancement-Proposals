name: Update README FEP listing

on:
  pull_request_target:
    types: [opened, closed, labeled, unlabeled, edited]

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Update README
        id: update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          python contrib/update_readme.py
          code=$?
          set -e
          [ $code -eq 1 ] && echo "updated=true" >> "$GITHUB_OUTPUT" || [ $code -eq 0 ] || exit $code

      - name: Open or update README PR
        if: steps.update.outputs.updated == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs: update README.md FEP listing"
          branch: automated/update-readme
          delete-branch: true
          title: "docs: update README.md FEP listing"
          body: |
            Automated update of the FEP listing in README.md.

            Triggered by: #${{ github.event.pull_request.number }} (${{ github.event.action }})
          labels: documentation
